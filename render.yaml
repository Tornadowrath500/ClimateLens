services:
  - type: web
    name: fairlens
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python -m pip install -e .
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
