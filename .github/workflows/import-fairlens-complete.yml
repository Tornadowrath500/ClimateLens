name: Import complete FairLens snapshot

on:
  push:
    branches:
      - automation/import-fairlens-snapshot
    paths:
      - incoming/fairlens-real-part-7.b64

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: automation/import-fairlens-snapshot
          persist-credentials: false

      - name: Verify and extract complete snapshot
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          incoming = Path("incoming")
          chunks = [incoming / f"fairlens-real-part-{i}.b64" for i in range(1, 8)]
          encoded = "".join(path.read_text(encoding="ascii").strip() for path in chunks)
          archive_bytes = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive_bytes).hexdigest()
          expected = "d90e90bceae19b1cea181b5203edd3aa75091e1c03c75fd9f51b7fd0c48e1a22"
          if digest != expected:
              raise ValueError(f"Snapshot checksum mismatch: {digest}")
          root = Path.cwd().resolve()
          extracted = set()

          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:gz") as archive:
              for member in archive.getmembers():
                  parts = PurePosixPath(member.name).parts
                  if not parts or parts[0] != "ClimateLens-main" or len(parts) < 2:
                      continue
                  relative = PurePosixPath(*parts[1:])
                  if relative.is_absolute() or ".." in relative.parts:
                      raise ValueError(f"Unsafe archive path: {member.name}")
                  if any(part in {".git", "__pycache__", ".pytest_cache", ".venv", "venv"} for part in relative.parts):
                      continue
                  if relative.suffix in {".pyc", ".pyo"} or not member.isfile():
                      continue
                  destination = (root / Path(*relative.parts)).resolve()
                  if root not in destination.parents:
                      raise ValueError(f"Archive path escapes repository: {member.name}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise ValueError(f"Could not read archive member: {member.name}")
                  with source, destination.open("wb") as target:
                      shutil.copyfileobj(source, target)
                  extracted.add(relative.as_posix())

          required = {
              "pages/5_Findings_and_Report.py",
              "pages/6_Methodology_and_Limitations.py",
              "src/fairlens/report.py",
              "tests/conftest.py",
              "tests/test_core.py",
              "tests/test_app_smoke.py",
          }
          missing = required - extracted
          if missing:
              raise RuntimeError(f"Snapshot incomplete; missing: {sorted(missing)}")
          if len(extracted) < 35:
              raise RuntimeError(f"Only extracted {len(extracted)} files; expected the complete project snapshot.")
          print(f"Verified {len(extracted)} source files; archive SHA-256 {digest}.")
          PY

      - name: Remove generated build metadata from Git tracking
        run: |
          git rm -r --cached src/fairlens.egg-info || true
          rm -rf src/fairlens.egg-info

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Require full test discovery and run all tests
        run: |
          python -m compileall -q app.py pages src/fairlens scripts tests
          python -m pytest --collect-only -q | tee /tmp/pytest-collect.txt
          python - <<'PY'
          import re
          from pathlib import Path
          output = Path("/tmp/pytest-collect.txt").read_text()
          match = re.search(r"(\d+) tests? collected", output)
          if not match or int(match.group(1)) < 35:
              raise SystemExit("Expected at least 35 collected tests, including Streamlit AppTest coverage.")
          print(f"Confirmed {match.group(1)} tests collected.")
          PY
          python -m pytest -q

      - name: Commit the verified full snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f incoming/fairlens-real-part-*.b64
          rm -f .github/workflows/import-fairlens-snapshot.yml
          rm -f .github/workflows/import-fairlens-complete.yml
          rmdir incoming 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import complete tested FairLens application"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:automation/import-fairlens-snapshot
