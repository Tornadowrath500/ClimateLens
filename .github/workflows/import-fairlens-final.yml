name: Import final FairLens source snapshot

on:
  push:
    branches:
      - automation/import-fairlens-snapshot
    paths:
      - incoming/fairlens-fix-part-8.b64

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: automation/import-fairlens-snapshot
          persist-credentials: false

      - name: Verify and safely extract the exact source snapshot
        run: |
          python - <<'PY'
          import base64, hashlib, io, shutil, tarfile
          from pathlib import Path, PurePosixPath

          chunks = [Path("incoming") / f"fairlens-fix-part-{i}.b64" for i in range(1, 9)]
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in chunks)
          if len(encoded) != 66184:
              raise RuntimeError(f"Unexpected encoded length: {len(encoded)}")
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          expected = "d90e90bceae19b1cea181b5203edd3aa75091e1c03c75fd9f51b7fd0c48e1a22"
          if digest != expected:
              raise RuntimeError(f"Snapshot checksum mismatch: {digest}")
          root = Path.cwd().resolve()
          extracted = set()

          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              for member in archive.getmembers():
                  parts = PurePosixPath(member.name).parts
                  if not parts or parts[0] != "ClimateLens-main" or len(parts) < 2:
                      continue
                  relative = PurePosixPath(*parts[1:])
                  if relative.is_absolute() or ".." in relative.parts:
                      raise RuntimeError(f"Unsafe archive path: {member.name}")
                  if any(part in {".git", "__pycache__", ".pytest_cache", ".venv", "venv"} for part in relative.parts):
                      continue
                  if relative.suffix in {".pyc", ".pyo"} or not member.isfile():
                      continue
                  target = (root / Path(*relative.parts)).resolve()
                  if root not in target.parents:
                      raise RuntimeError(f"Archive path escapes repository: {member.name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise RuntimeError(f"Could not read: {member.name}")
                  with source, target.open("wb") as destination:
                      shutil.copyfileobj(source, destination)
                  extracted.add(relative.as_posix())

          required = {
              "pages/5_Findings_and_Report.py",
              "pages/6_Methodology_and_Limitations.py",
              "src/fairlens/report.py",
              "tests/conftest.py",
              "tests/test_core.py",
              "tests/test_app_smoke.py",
          }
          missing = required - extracted
          if missing or len(extracted) < 35:
              raise RuntimeError(f"Incomplete snapshot: missing={sorted(missing)}, extracted={len(extracted)}")
          print(f"Extracted {len(extracted)} files; verified SHA-256 {digest}.")
          PY

      - name: Remove import artifacts and stale generated metadata
        run: |
          git rm -r --cached src/fairlens.egg-info 2>/dev/null || true
          rm -rf src/fairlens.egg-info
          rm -f incoming/fairlens-source-part-*.b64
          rm -f incoming/fairlens-real-part-*.b64
          rm -f incoming/fairlens-fix-part-*.b64
          rm -f .github/workflows/import-fairlens-snapshot.yml
          rm -f .github/workflows/import-fairlens-complete.yml
          rm -f .github/workflows/import-fairlens-final.yml
          rmdir incoming 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile, collect, and run the complete test suite
        run: |
          python -m compileall -q app.py pages src/fairlens scripts tests
          python -m pytest --collect-only -q | tee /tmp/pytest-collect.txt
          python - <<'PY'
          import re
          from pathlib import Path
          output = Path("/tmp/pytest-collect.txt").read_text()
          match = re.search(r"(\d+) tests? collected", output)
          if not match or int(match.group(1)) < 40:
              raise SystemExit("Expected >=40 tests, including Streamlit page AppTest checks.")
          print(f"Confirmed {match.group(1)} tests collected.")
          PY
          python -m pytest -q

      - name: Commit the complete tested snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 1
          fi
          git commit -m "Import tested FairLens application"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:automation/import-fairlens-snapshot
